<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>61-slider</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    
    <section class="home">

        <div class="details">
            <span>
                <p class="current-img"></p>
                /
                <p class="total-img"></p>
            </span>
        </div>
        
        <div class="slider">
            <div class="slide active" style="background-image:url('images/special-product-bg.png') ;">
                <div class="container">
                    <div class="img">
                        <img src="images/flavor-image-1.png" alt="">
                    </div>
                </div>

            </div>

            <div class="slide" style="background-image:url('images/special-product-bg.png') ;">
                <div class="container">
                    <div class="img">
                        <img src="images/flavor-image-2.png" alt="">
                    </div>
                </div>

            </div>

            <div class="slide" style="background-image:url('images/special-product-bg.png') ;">
                <div class="container">
                    <div class="img">
                        <img src="images/flavor-image-3.png" alt="">
                    </div>
                </div>

            </div>
        </div>


        <div class="controls">
            <div class="next"><i class="fas fa-chevron-right"></i></div>
            <div class="prev"><i class="fas fa-chevron-left"></i></div>
        </div>

        <div class="indicator"></div>
    </section>



    <script src="js/all.min.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
